<!--
  The LogoMark from src/components/common/Logo.tsx, inlined as a standalone file
  because index.html references /favicon.svg before React boots.

  Kept on a solid navy tile rather than transparent: browser tab strips and
  bookmark bars are light *or* dark, and the navy trailing shape vanishes on
  dark chrome without a ground. Colours are navy-800 / cyan-500 from
  tailwind.config.js — if the brand palette moves, move them here too.
-->
