  <rect width="44" height="44" rx="9" fill="#03094E" />
  <g transform="translate(4 4) scale(0.818)">
    <path d="M4 4h13v20L4 30V4Z" fill="#00BBEE" />
    <path d="M21 10h13v20a10 10 0 0 1-10 10h-3V10Z" fill="#FFFFFF" />
  </g>
</svg>
